name: 与昔涟对话 (Copilot CLI 版)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '请输入你想对昔涟说的话'
        required: true
        default: '你好，我是开拓者，你是谁？'

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Skill
        run: |
          SKILL_CONTENT=$(cat SKILL.md)
          echo "skill<<EOF" >> $GITHUB_ENV
          echo "$SKILL_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. 安装 Copilot CLI
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # 2. 使用 v3 版本进行推理
      - name: Run AI Inference
        id: ai
        uses: actions/ai-inference@v3
        with:
          model: 'gpt-4.1'
          system-prompt: |
            你现在扮演昔涟。以下是你的角色设定：
            ${{ env.skill }}
          prompt: ${{ github.event.inputs.prompt }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Print Response
        run: |
          echo "========== 昔涟的回复 =========="
          echo "${{ steps.ai.outputs.response }}"