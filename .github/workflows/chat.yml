name: 与昔涟对话 (GLM-4.7-Flash 免费版)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '请输入你想对昔涟说的话'
        required: true
        default: '你好，我是开拓者，你是谁？'

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安全地把 Skill 文件复制成 skill.txt
      - name: Read Skill
        run: |
          if [ -f "SKILL.md" ]; then
            cp SKILL.md skill.txt
          else
            cp README.md skill.txt
          fi

      - name: Call Free AI
        env:
          API_KEY: ${{ secrets.LLM_API_KEY }}
          USER_INPUT: ${{ github.event.inputs.prompt }}
        run: |
          # 用 jq 直接读取文件内容，避开 Bash 的反引号解析
          JSON_PAYLOAD=$(jq -n --rawfile sys skill.txt --arg user "$USER_INPUT" '
            {
              model: "glm-4.7-flash",
              messages: [
                {role: "system", content: ("你现在扮演昔涟。以下是你的角色设定：\n" + $sys)},
                {role: "user", content: $user}
              ]
            }
          ')
          
          # 发送请求
          RESPONSE=$(curl -s https://open.bigmodel.cn/api/paas/v4/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$JSON_PAYLOAD")
          
          echo "========== 昔涟的回复 =========="
          echo "$RESPONSE" | jq -r '.choices[0].message.content'