name: 与昔涟对话 (GitHub Copilot 免费版)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '请输入你想对昔涟说的话'
        required: true
        default: '你好，我是开拓者，你是谁？'

permissions:
  contents: read
  copilot-requests: write  # 允许 Copilot CLI 计费到你的账户

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Skill
        run: |
          # 注意：确认你的 skill 文件确实叫 SKILL.md，如果叫别的名字请修改这里
          if [ -f "SKILL.md" ]; then
            SKILL_CONTENT=$(cat SKILL.md)
          else
            SKILL_CONTENT=$(cat cyrene.skill.md 2>/dev/null || cat README.md)
          fi
          echo "skill<<EOF" >> $GITHUB_ENV
          echo "$SKILL_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run AI Inference
        id: ai
        uses: actions/ai-inference@v3
        with:
          model: 'gpt-4.1'
          system-prompt: |
            你现在扮演昔涟。以下是你的角色设定：
            ${{ env.skill }}
          prompt: ${{ github.event.inputs.prompt }}
        env:
          # 关键：把内置的 GitHub Token 显式传递为 Copilot CLI 认可的变量
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}

      - name: Print Response
        run: |
          echo "========== 昔涟的回复 =========="
          echo "${{ steps.ai.outputs.response }}"