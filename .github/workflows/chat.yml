name: 与昔涟对话 (GitHub Models 版)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: '请输入你想对昔涟说的话'
        required: true
        default: '你好，我是开拓者，你是谁？'

# 关键1：必须声明 copilot-requests 权限，才能使用 GITHUB_TOKEN 调用模型
permissions:
  contents: read
  copilot-requests: write

jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 读取根目录下的 Skill 文件（如果是 README.md，请修改下一行）
      - name: Read Skill
        run: |
          SKILL_CONTENT=$(cat SKILL.md)
          echo "skill<<EOF" >> $GITHUB_ENV
          echo "$SKILL_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装 Copilot CLI
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # 调用大模型（不再传入 COPILOT_GITHUB_TOKEN，使用默认 GITHUB_TOKEN 认证）
      - name: Run AI Inference
        id: ai
        uses: actions/ai-inference@v3
        with:
          model: 'gpt-4.1'
          system-prompt: |
            你现在扮演昔涟。以下是你的角色设定：
            ${{ env.skill }}
          prompt: ${{ github.event.inputs.prompt }}

      # 打印 AI 回复
      - name: Print Response
        run: |
          echo "========== 昔涟的回复 =========="
          echo "${{ steps.ai.outputs.response }}"