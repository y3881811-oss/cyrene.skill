name: 昔涟 Issue 聊天室

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write   # 必须要有这个权限，才能把 AI 的回复发到评论区

jobs:
  reply:
    # 安全限制：只有创建这个 Issue 的人自己评论，才会触发回复
    if: github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把 Skill 文件复制成 skill.txt
      - name: Read Skill
        run: |
          if [ -f "SKILL.md" ]; then
            cp SKILL.md skill.txt
          else
            cp README.md skill.txt
          fi

      - name: Call Free AI
        env:
          API_KEY: ${{ secrets.LLM_API_KEY }}
          USER_INPUT: ${{ github.event.comment.body }}
        run: |
          # 用 jq 安全读取 Skill 和你的评论，组合成 API 请求体
          JSON_PAYLOAD=$(jq -n --rawfile sys skill.txt --arg user "$USER_INPUT" '
            {
              model: "glm-4.7-flash",
              messages: [
                {role: "system", content: ("你现在扮演昔涟。以下是你的角色设定：\n" + $sys)},
                {role: "user", content: $user}
              ]
            }
          ')
          
          # 发送请求
          RESPONSE=$(curl -s https://open.bigmodel.cn/api/paas/v4/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "$JSON_PAYLOAD")
          
          # 提取 AI 回复，并保存到临时文件（用文件方式传递，避免特殊字符报错）
          echo "$RESPONSE" | jq -r '.choices[0].message.content' > reply.md

      - name: Reply to Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 把回复作为评论发到 Issue 里
          gh issue comment ${{ github.event.issue.number }} --body-file reply.md